version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      ignore:
          # Equicord pins these deliberately; a bump lands through the upstream merge instead.
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
