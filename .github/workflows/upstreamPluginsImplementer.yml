name: Sync Upstream Folder

on:
  schedule:
    - cron: '0 0 * * *'  # daily update (adjust as needed)
  workflow_dispatch:

jobs:
  update-folder:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout fork repo
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Add upstream remote
      run: git remote add upstream https://github.com/upstream-owner/equicord.git

    - name: Fetch upstream changes
      run: git fetch upstream

    - name: Checkout upstream branch
      run: git checkout upstream/main -- path/to/folder

    - name: Commit and push changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add path/to/folder
        git commit -m "Sync folder from upstream"
        git push origin HEAD:main
      continue-on-error: true  # avoid failure if nothing changed